name: CI
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
  pull_request:

jobs:
  # Fast feedback (~1 min): every test marked `unit`, no Docker / DB / Modal / ngrok.
  # Runs on PRs too. The end-to-end job below still runs on main/dev pushes.
  unit-test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      DATABASE_URL: postgresql+asyncpg://unit:unit@localhost:5432/unit  # import-time only, never connected
      CURRENT_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --dev --frozen --no-install-project
      - name: Unit tests
        run: PYTHONPATH=src uv run --no-sync pytest -m unit -p no:cacheprovider

  integration-test:
    # Needs Modal, S3 and ngrok secrets (one ngrok session at a time), so not on PRs.
    if: github.event_name != 'pull_request'
    # ngrok free plan = 3 agent sessions; queue instead of failing with ERR_NGROK_108 when
    # several PRs merge at once. Never cancel a running job (migrate depends on it).
    concurrency:
      group: ngrok-integration
      cancel-in-progress: false
    runs-on: blacksmith-32vcpu-ubuntu-2404
    env:
      NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      SPACES_KEY_V2: ${{ secrets.SPACES_KEY }}
      SPACES_SECRET_V2: ${{ secrets.SPACES_SECRET }}
      LOGFIRE_TOKEN: ${{ secrets.LOGFIRE_TOKEN }}
      AUTUMN_SECRET_KEY: ${{ secrets.AUTUMN_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: useblacksmith/setup-docker-builder@v1

      - name: Build containers
        run: docker compose -f docker-compose.test.yml build

      - name: Run tests
        env:
          DB_HOST: postgres
          REDIS_HOST: serverless-redis-http
          CH_HOST: clickhouse
          NGROK_HOST: ngrok
        run: docker compose -f docker-compose.test.yml up --exit-code-from app --remove-orphans

      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  migrate:
    needs: [unit-test, integration-test]
    runs-on: blacksmith-32vcpu-ubuntu-2404
    # drop the "contains" portion, since we already filter at top-level
    if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'dev')
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'dev' }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run database migrations
        run: bun run migrate-production
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
